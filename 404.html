<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pagina non trovata — Giochi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#171A1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171A1F'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23F2A93B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://bacchin.app/fonts/fonts.css">
<style>
:root { --ardesia:#171A1F; --pannello:#20242C; --gesso:#EDEAE3; --nebbia:#8B93A1; --linea:rgba(237,234,227,0.10); --ambra:#F2A93B;
  --testo:'Archivo', system-ui, -apple-system, sans-serif; --dato:'Martian Mono', ui-monospace, SFMono-Regular, monospace; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ardesia); color:var(--gesso); font-family:var(--testo); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
.foglio { max-width:880px; margin:0 auto; padding:56px 24px 88px; }
@media (min-width:1100px) { .foglio { max-width:1080px; padding-left:40px; padding-right:40px; } }
.etichetta { font-family:var(--testo); font-variation-settings:'wdth' 75; font-weight:600; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--nebbia); text-decoration:none; }
.testata { display:flex; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--linea); }
h1 { font-variation-settings:'wdth' 125; font-weight:800; font-size:clamp(30px, 10.4vw, 96px); line-height:0.86; letter-spacing:-0.03em; text-transform:uppercase; margin:56px 0 22px; }
h1 span { color:var(--ambra); }
.tesi { color:var(--nebbia); font-size:19px; text-align:justify; hyphens:auto; -webkit-hyphens:auto; margin-bottom:40px; }
.tesi strong { color:var(--gesso); font-weight:500; }
.coppia { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; }
.scheda { display:block; background:var(--pannello); border:1px solid var(--linea); border-radius:14px; padding:24px 22px; text-decoration:none; transition:border-color .2s; }
.scheda:hover { border-color:var(--ambra); }
.scheda__nome { font-weight:700; font-size:20px; line-height:1.2; }
.scheda__che { color:var(--nebbia); font-size:15px; margin-top:8px; }
.scheda__vai { display:block; margin-top:14px; font-family:var(--dato); font-size:12px; color:var(--ambra); }
.piede { margin-top:64px; padding-top:18px; border-top:1px solid var(--linea); display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px 24px; }
.piede nav { display:flex; gap:20px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="foglio">
  <header class="testata">
    <a class="etichetta" href="/">Giochi</a>
    <span class="etichetta">404</span>
  </header>
  <h1>Questo gioco<br><span>non c'è</span></h1>
  <p class="tesi">L'indirizzo che hai aperto non esiste. <strong><a href="/">Torna ai giochi</a></strong>.</p>
  <footer class="piede">
    <span class="etichetta">© 2026 Fabrizio Bacchin</span>
    <nav>
      <a class="etichetta" href="https://bacchin.app/">Tutte le app</a>
      <a class="etichetta" href="https://github.com/fbacchin/Giochi">Codice su GitHub</a>
      <a class="etichetta" href="https://bacchin.app/privacy#giochi">Privacy e assistenza</a>
    </nav>
  </footer>
</div>
</body>
</html>
