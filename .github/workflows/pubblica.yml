# Pubblica il sito: allinea gh-pages a main a ogni push.
#
# GitHub Pages, in questo repo, serve il ramo gh-pages. Invece di doverlo
# aggiornare a mano ogni volta, ci pensa questo lavoro: si spinge su main e
# basta. Se un giorno cambi la sorgente di Pages in Settings -> Pages
# mettendo main, questo file diventa inutile e si può cancellare.

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:      # si puo' anche lanciare a mano dalla scheda Actions

permissions:
  contents: write         # serve per spingere su gh-pages

concurrency:
  group: pubblica-sito    # mai due pubblicazioni in contemporanea
  cancel-in-progress: false

jobs:
  allinea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve la storia intera, altrimenti il push non passa

      # Avanzamento semplice: gh-pages è una copia di main, nessuno ci lavora
      # sopra. Se qualcuno ci ha messo mano il push fallisce, e si vede:
      # meglio un errore rosso che sovrascrivere il lavoro di qualcun altro.
      - name: Allinea gh-pages a main
        run: git push origin HEAD:gh-pages
